[package]
name = "mutica-core"
description = "Core library for the Mutica programming language"
license = "MIT"
authors = ["sjrsjz"]
repository = "https://github.com/sjrsjz/Mutica"
categories = ["compilers", "parser-implementations", "development-tools"]


version.workspace = true
edition.workspace = true

[dependencies]
arena-arc = { version = "0.1.2" }
ariadne = "0.4.1"
rust-arc-gc = "0.2.1"
smallvec = "1.15.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
stacksafe = "0.1.4"

[lib]
path = "src/lib.rs"
